name: Build RR-IT Insight installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    # Leave all three blank for a plain generic build. Fill them in to
    # compile a PRE-CONFIGURED installer for one client (Client ID, ingest
    # key and USB choice baked in, wizard pages skipped) — see the
    # PRESET_* notes at the top of installer/installer.iss. The ingest key
    # is NOT an input: it is read from the repository secret named
    # INGEST_KEY_<CLIENT_SLUG in upper case>, e.g. INGEST_KEY_RORYMACK,
    # so it never appears in the run page or logs. Per-client builds are
    # run artifacts only — never a Release, never auto-update signed.
    inputs:
      client_slug:
        description: "Client slug for a pre-configured build, letters/digits only (e.g. RoryMack). Blank = generic installer."
        required: false
        default: ""
      client_id:
        description: "That client's Client ID (from the RR-IT console). Required when client_slug is set."
        required: false
        default: ""
      usb_monitoring:
        description: "Bake in USB removable-drive monitoring = ON for this client"
        type: boolean
        required: false
        default: false

# Needed so GITHUB_TOKEN can create the GitHub Release on tag builds.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install pusher build deps
        run: |
          pip install -r pusher/requirements.txt
          pip install pyinstaller

      - name: Build pusher.exe with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name aw_pusher --distpath installer\staging pusher\aw_pusher.py

      - name: Build usb_watcher.exe with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name usb_watcher --distpath installer\staging pusher\usb_watcher.py

      - name: Download NSSM
        shell: pwsh
        run: |
          # NSSM ("the Non-Sucking Service Manager") wraps aw_pusher.exe as
          # a real Windows Service — see installer.iss's InstallPusherService
          # for why the pusher moved off Scheduled Tasks in v2.0.0.
          Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-2.24.zip" -OutFile "$env:RUNNER_TEMP\nssm.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\nssm.zip" -DestinationPath "$env:RUNNER_TEMP\nssm" -Force
          Copy-Item "$env:RUNNER_TEMP\nssm\nssm-2.24\win64\nssm.exe" -Destination "installer\staging\nssm.exe"

      - name: Download latest ActivityWatch Windows installer
        shell: pwsh
        env:
          # Authenticated GitHub API requests get a much higher rate limit
          # (5000/hr) than anonymous ones (60/hr, shared across every
          # GitHub-hosted runner on this IP) — anonymous ran out after a
          # handful of builds in the same hour. GITHUB_TOKEN is injected
          # automatically by Actions, no setup needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ActivityWatch/activitywatch/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -like "*windows*.exe" -or $_.name -like "*win*setup*.exe" } | Select-Object -First 1
          if (-not $asset) { throw "Could not find a Windows installer asset in the latest ActivityWatch release" }
          Write-Host "Downloading $($asset.name) from $($asset.browser_download_url)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "installer\staging\activitywatch-setup.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Resolve build flavour
        id: flavour
        shell: pwsh
        env:
          CLIENT_SLUG: ${{ inputs.client_slug }}
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          $slug = ($env:CLIENT_SLUG ?? "").Trim()
          if ($slug -eq "") {
            "preset=false" >> $env:GITHUB_OUTPUT
            "artifact=RR-IT-Insight-Setup" >> $env:GITHUB_OUTPUT
            Write-Host "Generic build"
            exit 0
          }
          if ($slug -notmatch '^[A-Za-z0-9]+$') { throw "client_slug must be letters/digits only, got '$slug'" }
          if (($env:CLIENT_ID ?? "").Trim() -eq "") { throw "client_id is required for a pre-configured build" }
          "preset=true" >> $env:GITHUB_OUTPUT
          "slug=$slug" >> $env:GITHUB_OUTPUT
          "secret_name=INGEST_KEY_$($slug.ToUpper())" >> $env:GITHUB_OUTPUT
          "artifact=RR-IT-Insight-Setup-$slug" >> $env:GITHUB_OUTPUT
          Write-Host "Pre-configured build for $slug (key from secret INGEST_KEY_$($slug.ToUpper()))"

      - name: Compile installer (generic)
        if: steps.flavour.outputs.preset != 'true'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss

      - name: Compile installer (pre-configured for client)
        if: steps.flavour.outputs.preset == 'true'
        shell: pwsh
        env:
          CLIENT_SLUG: ${{ steps.flavour.outputs.slug }}
          CLIENT_ID: ${{ inputs.client_id }}
          USB_ON: ${{ inputs.usb_monitoring }}
          SECRET_NAME: ${{ steps.flavour.outputs.secret_name }}
          INGEST_KEY: ${{ secrets[steps.flavour.outputs.secret_name] }}
        run: |
          if (($env:INGEST_KEY ?? "") -eq "") {
            throw "Repository secret $env:SECRET_NAME is missing or empty. Add it under Settings > Secrets and variables > Actions, then re-run."
          }
          $usb = if ($env:USB_ON -eq "true") { "1" } else { "0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DPRESET_CLIENT_SLUG=$env:CLIENT_SLUG" `
            "/DPRESET_CLIENT_ID=$($env:CLIENT_ID.Trim())" `
            "/DPRESET_API_KEY=$env:INGEST_KEY" `
            "/DPRESET_USB=$usb" `
            installer\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Sign release manifest (auto-update)
        if: steps.flavour.outputs.preset != 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          pip install cryptography
          python installer\sign_release.py installer\installer.iss installer\Output\RR-IT-Insight-Setup.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.flavour.outputs.artifact }}
          path: installer\Output\${{ steps.flavour.outputs.artifact }}.exe
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.1
        with:
          files: |
            installer\Output\RR-IT-Insight-Setup.exe
            installer\Output\manifest.json
            installer\Output\manifest.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
