name: Build RR-IT Insight installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

# Needed so GITHUB_TOKEN can create the GitHub Release on tag builds.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install pusher build deps
        run: |
          pip install -r pusher/requirements.txt
          pip install pyinstaller

      - name: Build pusher.exe with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name aw_pusher --distpath installer\staging pusher\aw_pusher.py

      - name: Build usb_watcher.exe with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name usb_watcher --distpath installer\staging pusher\usb_watcher.py

      - name: Download NSSM
        shell: pwsh
        run: |
          # NSSM ("the Non-Sucking Service Manager") wraps aw_pusher.exe as
          # a real Windows Service — see installer.iss's InstallPusherService
          # for why the pusher moved off Scheduled Tasks in v2.0.0.
          Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-2.24.zip" -OutFile "$env:RUNNER_TEMP\nssm.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\nssm.zip" -DestinationPath "$env:RUNNER_TEMP\nssm" -Force
          Copy-Item "$env:RUNNER_TEMP\nssm\nssm-2.24\win64\nssm.exe" -Destination "installer\staging\nssm.exe"

      - name: Download latest ActivityWatch Windows installer
        shell: pwsh
        env:
          # Authenticated GitHub API requests get a much higher rate limit
          # (5000/hr) than anonymous ones (60/hr, shared across every
          # GitHub-hosted runner on this IP) — anonymous ran out after a
          # handful of builds in the same hour. GITHUB_TOKEN is injected
          # automatically by Actions, no setup needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ActivityWatch/activitywatch/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -like "*windows*.exe" -or $_.name -like "*win*setup*.exe" } | Select-Object -First 1
          if (-not $asset) { throw "Could not find a Windows installer asset in the latest ActivityWatch release" }
          Write-Host "Downloading $($asset.name) from $($asset.browser_download_url)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "installer\staging\activitywatch-setup.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: RR-IT-Insight-Setup
          path: installer\Output\RR-IT-Insight-Setup.exe
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.1
        with:
          files: installer\Output\RR-IT-Insight-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
